<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adjei Asante | Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Top Gradient Banner -->
  <header class="hero-banner">
    <div class="banner-content">
      <h1>⚡ ADJEI ASANTE</h1>
    </div>
    <div class="banner-wave"></div>
  </header>

  <!-- Profile Header & Two-Tone Buttons -->
  <section class="profile-header">
    <!-- Optional Logo Circle -->
    <div class="brand-badge">AA</div>

    <!-- Typing Effect Line -->
    <h2 class="typing-text"><span id="typed"></span><span class="cursor">|</span></h2>

    <!-- Tagline -->
    <p class="tagline">Web Developer • Tech Enthusiast • Ghana 🇬🇭</p>

    <!-- Row 1: Two-Tone Buttons -->
    <div class="badge-row">
      <a href="#projects" class="pill-btn">
        <span class="pill-left">🌐 PORTFOLIO</span>
        <span class="pill-right blue">ADJEIASANTE.WEBSITE</span>
      </a>
      <a href="https://github.com/AdjeiAsante" target="_blank" class="pill-btn">
        <span class="pill-left">💻 GITHUB</span>
        <span class="pill-right red">CODINGMINDSET</span>
      </a>
    </div>

    <!-- Row 2: Contact Button -->
    <div class="badge-row">
      <a href="#contact" class="pill-btn">
        <span class="pill-left">💬 WHATSAPP</span>
        <span class="pill-right green">LET'S CHAT</span>
      </a>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
